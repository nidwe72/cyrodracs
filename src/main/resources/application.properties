spring.application.name=cyrodracs

# Database files live outside the repository in cyrodracs_db/
app.bootstrap.path=/home/nidwe72/development/playground/playground-webapp/cyrodracs_db/appConfigBootstrap.db
app.default-db.url=jdbc:sqlite:/home/nidwe72/development/playground/playground-webapp/cyrodracs_db/appConfig.db

# JPA – Hibernate creates / updates tables against the PostgreSQL DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
