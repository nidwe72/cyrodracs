spring.application.name=cyrodracs

# Bootstrap SQLite file path (override via env var APP_BOOTSTRAP_PATH)
app.bootstrap.path=./appConfigBootstrap.db

# JPA – Hibernate creates / updates tables against the PostgreSQL DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
